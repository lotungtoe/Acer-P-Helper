name: .NET 10 WinForms Native AOT Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        # Native AOT bắt buộc cấu hình Release để trình tối ưu hóa gọt code thừa (Trim)
        configuration: [Release]
        # Tạo ma trận dịch ra 2 phiên bản mã máy riêng biệt cho chip Intel/AMD (x64) và ARM (Surface, v.v.)
        architecture: [x64, arm64]

    runs-on: windows-latest  

    env:
      # BẮT BUỘC: Điền đường dẫn tới file .csproj của bạn (Ví dụ: "MyWinFormsApp/MyApp.csproj")
      Project_Path: "your-project-folder/your-project-name.csproj"
      
      # Điền đường dẫn tới project test nếu có (nếu không có, bạn có thể xóa dòng này)
      Test_Project_Path: "your-test-project-path/your-test-project.csproj"

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. Cài đặt SDK .NET 10 mới nhất (Bắt buộc để chạy target net10.0-windows)
    - name: Install .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: true # Cần thiết nếu .NET 10 đang trong giai đoạn Preview như gói System.Management của bạn

    # 2. Khởi chạy kiểm thử tự động (Xóa bước này nếu dự án của bạn không tạo thư mục Test)
    - name: Execute unit tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }}
      continue-on-error: true # Bỏ qua nếu chưa cấu hình xong project test

    # 3. Tiến hành dịch THẲNG THÀNH MÃ MÁY bằng .NET CLI (Thay thế hoàn toàn cho MSBuild cũ)
    - name: Publish Native AOT Executable
      run: |
        dotnet publish ${{ env.Project_Path }} `
          --configuration ${{ matrix.configuration }} `
          --runtime win-${{ matrix.architecture }} `
          -p:PublishAot=true `
          -p:PublishSingleFile=true `
          --output ./publish-output-${{ matrix.architecture }}
      # GIẢI THÍCH LỆNH CHẠY:
      # -p:PublishAot=true -> Kích hoạt ép lõi .NET 10 dịch thẳng ra mã máy
      # -p:PublishSingleFile=true -> Gom tất cả thư viện, asset thành 1 file .EXE độc nhất không cần cài đặt kèm theo

    # 4. Gom file .EXE mã máy hoàn chỉnh lên mục Artifacts trên GitHub để bạn tải về sử dụng
    - name: Upload Native Executable Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WinForms-Native-AOT-win-${{ matrix.architecture }}
        path: ./publish-output-${{ matrix.architecture }}/
